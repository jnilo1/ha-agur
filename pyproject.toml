[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.agur --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/agur"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 99
